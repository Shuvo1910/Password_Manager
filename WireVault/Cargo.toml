[package]
name = "password-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Password Manager offline-first portable password manager"

[dependencies]
eframe = { package = "eframe", version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.15"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "Password Manager"
identifier = "dev.passwordmanager.desktop"

[[bin]]
name = "password-manager"
path = "src/main.rs"

